[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arcTestnet = "${ARC_TESTNET_RPC}"
arcMainnet = "${ARC_MAINNET_RPC}"

[etherscan]
arcTestnet = { key = "${ARCSCAN_API_KEY}", url = "https://explorer.testnet.arc.network/api" }
